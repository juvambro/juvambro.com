<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles | Juvambro</title>
  <meta name="description" content="Explore ideas and practical guidance for self-awareness and personal growth.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #ffffff;
      line-height: 1.7;
    }

    header {
      padding: 22px 5%;
      border-bottom: 1px solid #eeeeee;
    }

    header a {
      color: #172033;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    header span {
      color: #5146e5;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 70px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 45px;
    }

    .intro h1 {
      font-size: clamp(36px, 6vw, 56px);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .intro p {
      color: #606779;
      font-size: 18px;
    }

    .article-card {
      padding: 28px;
      margin-bottom: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
    }

    .article-card h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .article-card p {
      color: #606779;
      margin-bottom: 15px;
    }

    .article-card a {
      color: #5146e5;
      font-weight: 700;
      text-decoration: none;
    }

    .empty-message {
      text-align: center;
      color: #606779;
      padding: 35px 0;
    }

    footer {
      text-align: center;
      padding: 30px 5%;
      border-top: 1px solid #eeeeee;
      color: #606779;
    }

    footer a {
      color: #5146e5;
      text-decoration: none;
    }
  </style>

</head>

<body>
  <header>
    <a href="index.html">Juvambro<span>.</span></a>
  </header>

  <main>
    <section class="intro">
      <h1>Ideas for <span style="color:#5146e5;">Personal Growth</span></h1>
      <p>Practical ideas to understand yourself, build better habits, and grow.</p>
    </section>

<section id="articles">
    <p class="empty-message">Loading articles...</p>
</section>


  </main>

  <footer>
    <p><a href="index.html">Back to Juvambro</a></p>
  </footer>
<script>
async function loadArticles() {
  const container = document.getElementById("articles");

  try {
    const response = await fetch("articles/index.json");
    if (!response.ok) throw new Error("Articles could not be loaded.");

    const articles = await response.json();
    container.innerHTML = "";

    if (articles.length === 0) {
      container.innerHTML = '<p class="empty-message">New articles are coming soon.</p>';
      return;
    }

    articles.sort((a, b) => new Date(b.date) - new Date(a.date));

    articles.forEach(article => {
      const card = document.createElement("article");
      card.className = "article-card";

      const title = document.createElement("h2");
      title.textContent = article.title;

      const description = document.createElement("p");
      description.textContent = article.description || "";

      const date = document.createElement("p");
      date.className = "article-date";
      date.textContent = article.date || "";

      const link = document.createElement("a");
      link.href = "articles/" + encodeURIComponent(article.slug) + ".html";
      link.textContent = "Read article";

      card.append(title, date, description, link);
      container.appendChild(card);
    });
  } catch (error) {
    container.innerHTML = '<p class="empty-message">Articles are temporarily unavailable. Please try again later.</p>';
    console.error(error);
  }
}

loadArticles();
</script>

</body>
</html>
