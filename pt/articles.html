<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artigos | Juvambro</title>
  <meta name="description" content="Explora ideias e orientações práticas para desenvolveres o autoconhecimento e o crescimento pessoal.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #ffffff;
      line-height: 1.7;
    }

    header {
      padding: 22px 5%;
      border-bottom: 1px solid #eeeeee;
    }

    header a {
      color: #172033;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    header span {
      color: #5146e5;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 70px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 45px;
    }

    .intro h1 {
      font-size: clamp(36px, 6vw, 56px);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .intro p {
      color: #606779;
      font-size: 18px;
    }

    .article-card {
      padding: 28px;
      margin-bottom: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
    }

    .article-card h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .article-card p {
      color: #606779;
      margin-bottom: 15px;
    }

    .article-card a {
      color: #5146e5;
      font-weight: 700;
      text-decoration: none;
    }

    .empty-message {
      text-align: center;
      color: #606779;
      padding: 35px 0;
    }

    .article-share {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #eeeeee;
    }
    .article-share-label {
      width: 100%;
      margin-bottom: 2px;
      color: #606779;
      font-size: 14px;
      font-weight: 600;
    }
    .share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      color: #344054;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .share-button:hover {
      border-color: #5146e5;
      color: #5146e5;
    }
    .share-status {
      width: 100%;
      min-height: 18px;
      color: #287a73;
      font-size: 13px;
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 30px 5%;
      border-top: 1px solid #eeeeee;
      color: #606779;
    }

    footer a {
      color: #5146e5;
      text-decoration: none;
    }
  </style>

</head>

<body>
  <header>
    <a href="index.html">Juvambro<span>.</span></a>
  </header>

  <main>
    <section class="intro">
      <h1>Ideias para o <span style="color:#5146e5;">Crescimento Pessoal</span></h1>
      <p>Ideias práticas para te conheceres melhor, desenvolveres bons hábitos e cresceres.</p>
    </section>

<section id="articles">
    <p class="empty-message">A carregar artigos...</p>
</section>


  </main>

  <footer>
    <p><a href="index.html">Voltar à Juvambro</a></p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<script>
async function loadArticles() {
  const container = document.getElementById("articles");

  container.innerHTML = '<p class="empty-message">A carregar artigos...</p>';

  try {
    const response = await fetch(
      "https://api.github.com/repos/juvambro/juvambro.com/contents/articles"
    );

    if (!response.ok) {
      throw new Error("Não foi possível obter os artigos do GitHub.");
    }

    const files = await response.json();

    const markdownFiles = files.filter(file =>
      file.name.endsWith(".md")
    );

    const articles = await Promise.all(
      markdownFiles.map(async file => {
        const articleResponse = await fetch(file.download_url);

        if (!articleResponse.ok) {
          throw new Error("Could not load " + file.name);
        }

        const markdown = await articleResponse.text();
       const frontmatterMatch = markdown.match(
  /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
);

if (!frontmatterMatch) {
  throw new Error("Formato de artigo inválido: " + file.name);
}

const metadata = jsyaml.load(frontmatterMatch[1]) || {};
const body = frontmatterMatch[2].trim();

return {
  title: metadata.title || file.name.replace(".md", ""),
  date: metadata.date || "",
  description: metadata.description || "",
  body: body,
  slug: file.name.replace(/\.md$/i, "")
};
      })
    );

    articles.sort((a, b) =>
      new Date(b.date) - new Date(a.date)
    );

    container.innerHTML = "";

    if (articles.length === 0) {
      container.innerHTML =
        '<p class="empty-message">Em breve, haverá novos artigos.</p>';
      return;
    }

    articles.forEach(article => {
      const card = document.createElement("article");
      card.className = "article-card";

      const title = document.createElement("h2");
      title.textContent = article.title;

      const date = document.createElement("p");
      date.className = "article-date";
      const parsedDate = new Date(article.date);
date.textContent = Number.isNaN(parsedDate.getTime())
  ? ""
  : new Intl.DateTimeFormat("pt-PT", {
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(parsedDate);
      const description = document.createElement("p");
      description.textContent = article.description;

      const button = document.createElement("button");
      button.textContent = "Ler artigo";
      button.style.cssText =
        "background:none;border:none;color:#5146e5;font-size:16px;font-weight:bold;cursor:pointer;padding:0;";

      const content = document.createElement("div");
      content.style.display = "none";
      content.style.marginTop = "20px";

      content.innerHTML = DOMPurify.sanitize(
        marked.parse(article.body)
      );

      button.addEventListener("click", () => {
        const isHidden = content.style.display === "none";
        content.style.display = isHidden ? "block" : "none";
        button.textContent = isHidden ? "Fechar artigo" : "Ler artigo";
      });

      const shareBox = document.createElement("div");
      shareBox.className = "article-share";

      const shareLabel = document.createElement("div");
      shareLabel.className = "article-share-label";
      shareLabel.textContent = "Partilhar este artigo";

      const articleUrl = new URL(window.location.href);
      articleUrl.search = "";
      articleUrl.hash = "";
      articleUrl.searchParams.set("article", article.slug);
      const shareUrl = articleUrl.toString();

      const whatsappLink = document.createElement("a");
      whatsappLink.className = "share-button";
      whatsappLink.textContent = "WhatsApp";
      whatsappLink.href = "https://wa.me/?text=" + encodeURIComponent(article.title + " " + shareUrl);
      whatsappLink.target = "_blank";
      whatsappLink.rel = "noopener noreferrer";

      const facebookLink = document.createElement("a");
      facebookLink.className = "share-button";
      facebookLink.textContent = "Facebook";
      facebookLink.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(shareUrl);
      facebookLink.target = "_blank";
      facebookLink.rel = "noopener noreferrer";

      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "share-button";
      copyButton.textContent = "Copiar link";

      const shareStatus = document.createElement("p");
      shareStatus.className = "share-status";
      shareStatus.setAttribute("aria-live", "polite");

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(shareUrl);
          shareStatus.textContent = "Link copiado!";
        } catch (error) {
          shareStatus.textContent = "Não foi possível copiar o link. " + shareUrl;
        }
      });

      shareBox.append(shareLabel, whatsappLink, facebookLink, copyButton, shareStatus);
      content.appendChild(shareBox);

      card.append(title, date, description, button, content);
      container.appendChild(card);

      if (new URLSearchParams(window.location.search).get("article") === article.slug) {
        content.style.display = "block";
        button.textContent = "Fechar artigo";
        setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
      }
    });

  } catch (error) {
    container.innerHTML =
      '<p class="empty-message">Os artigos estão temporariamente indisponíveis. Por favor, tenta novamente mais tarde.</p>';

    console.error(error);
  }
}

loadArticles();
</script>

</body>
</html>
