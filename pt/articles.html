<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artigos | Juvambro</title>
  <meta name="description" content="Explora ideias e orientações práticas para desenvolveres o autoconhecimento e o crescimento pessoal.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #ffffff;
      line-height: 1.7;
    }

    header {
      padding: 22px 5%;
      border-bottom: 1px solid #eeeeee;
    }

    header a {
      color: #172033;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    header span {
      color: #5146e5;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 70px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 45px;
    }

    .intro h1 {
      font-size: clamp(36px, 6vw, 56px);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .intro p {
      color: #606779;
      font-size: 18px;
    }

    .article-card {
      padding: 28px;
      margin-bottom: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
    }

    .article-card h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .article-card p {
      color: #606779;
      margin-bottom: 15px;
    }

    .article-card a {
      color: #5146e5;
      font-weight: 700;
      text-decoration: none;
    }

    .empty-message {
      text-align: center;
      color: #606779;
      padding: 35px 0;
    }

    footer {
      text-align: center;
      padding: 30px 5%;
      border-top: 1px solid #eeeeee;
      color: #606779;
    }

    footer a {
      color: #5146e5;
      text-decoration: none;
    }
  </style>

</head>

<body>
  <header>
    <a href="index.html">Juvambro<span>.</span></a>
  </header>

  <main>
    <section class="intro">
      <h1>Ideias para o <span style="color:#5146e5;">Crescimento Pessoal</span></h1>
      <p>Ideias práticas para te conheceres melhor, desenvolveres bons hábitos e cresceres.</p>
    </section>

<section id="articles">
    <p class="empty-message">A carregar artigos...</p>
</section>


  </main>

  <footer>
    <p><a href="index.html">Voltar à Juvambro</a></p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<script>
async function loadArticles() {
  const container = document.getElementById("articles");

  container.innerHTML = '<p class="empty-message">A carregar artigos...</p>';

  try {
    const response = await fetch(
      "https://api.github.com/repos/juvambro/juvambro.com/contents/articles"
    );

    if (!response.ok) {
      throw new Error("Não foi possível obter os artigos do GitHub.");
    }

    const files = await response.json();

    const markdownFiles = files.filter(file =>
      file.name.endsWith(".md")
    );

    const articles = await Promise.all(
      markdownFiles.map(async file => {
        const articleResponse = await fetch(file.download_url);

        if (!articleResponse.ok) {
          throw new Error("Could not load " + file.name);
        }

        const markdown = await articleResponse.text();
       const frontmatterMatch = markdown.match(
  /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
);

if (!frontmatterMatch) {
  throw new Error("Formato de artigo inválido: " + file.name);
}

const metadata = jsyaml.load(frontmatterMatch[1]) || {};
const body = frontmatterMatch[2].trim();

return {
  title: metadata.title || file.name.replace(".md", ""),
  date: metadata.date || "",
  description: metadata.description || "",
  body: body
};
      })
    );

    articles.sort((a, b) =>
      new Date(b.date) - new Date(a.date)
    );

    container.innerHTML = "";

    if (articles.length === 0) {
      container.innerHTML =
        '<p class="empty-message">Em breve, haverá novos artigos.</p>';
      return;
    }

    articles.forEach(article => {
      const card = document.createElement("article");
      card.className = "article-card";

      const title = document.createElement("h2");
      title.textContent = article.title;

      const date = document.createElement("p");
      date.className = "article-date";
      const parsedDate = new Date(article.date);
date.textContent = Number.isNaN(parsedDate.getTime())
  ? ""
  : new Intl.DateTimeFormat("pt-PT", {
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(parsedDate);
      const description = document.createElement("p");
      description.textContent = article.description;

      const button = document.createElement("button");
      button.textContent = "Ler artigo";
      button.style.cssText =
        "background:none;border:none;color:#5146e5;font-size:16px;font-weight:bold;cursor:pointer;padding:0;";

      const content = document.createElement("div");
      content.style.display = "none";
      content.style.marginTop = "20px";

      content.innerHTML = DOMPurify.sanitize(
        marked.parse(article.body)
      );

      button.addEventListener("click", () => {
        const isHidden = content.style.display === "none";
        content.style.display = isHidden ? "block" : "none";
        button.textContent = isHidden ? "Fechar artigo" : "Ler artigo";
      });

      card.append(title, date, description, button, content);
      container.appendChild(card);
    });

  } catch (error) {
    container.innerHTML =
      '<p class="empty-message">Os artigos estão temporariamente indisponíveis. Por favor, tenta novamente mais tarde.</p>';

    console.error(error);
  }
}

loadArticles();
</script>

</body>
</html>
